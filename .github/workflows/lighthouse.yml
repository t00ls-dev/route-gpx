name: Lighthouse
# Audits the published site on Dependabot's schedule (Monday 00:00 UTC) and on
# demand. Not a required check; it never builds or publishes.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse
  cancel-in-progress: false
jobs:
  audit:
    name: Lighthouse audit of the live site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lighthouse
        env:
          SITE_URL: https://route-gpx.t00ls.dev/
          RUNS: 3
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .lighthouse.local/summary.md ]; then
            cat .lighthouse.local/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouse.local/
          include-hidden-files: true
          retention-days: 30
