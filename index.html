<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>route-gpx — Driving Route Planner &amp; GPX Export</title>
    <meta
      name="description"
      content="Plan driving routes along real roads, choose stops and download complete GPX tracks. Free, open source, no API key or account needed."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="route-gpx" />
    <link rel="canonical" href="https://t00ls-dev.github.io/route-gpx/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="route-gpx" />
    <meta
      property="og:title"
      content="route-gpx — Driving Route Planner &amp; GPX Export"
    />
    <meta
      property="og:description"
      content="Plan driving routes along real roads, choose stops and download complete GPX tracks. Free, open source, no API key or account needed."
    />
    <meta property="og:url" content="https://t00ls-dev.github.io/route-gpx/" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:image"
      content="https://t00ls-dev.github.io/route-gpx/social-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="route-gpx — Choose your roads. Download every turn."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="route-gpx — Driving Route Planner &amp; GPX Export"
    />
    <meta
      name="twitter:description"
      content="Plan driving routes along real roads, choose stops and download complete GPX tracks. Free, open source, no API key or account needed."
    />
    <meta
      name="twitter:image"
      content="https://t00ls-dev.github.io/route-gpx/social-card.png"
    />
    <meta name="twitter:image:alt" content="route-gpx driving route planner" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "route-gpx",
        "url": "https://t00ls-dev.github.io/route-gpx/",
        "description": "Plan driving routes along real roads, choose stops and download complete GPX tracks. Free, open source, no API key or account needed.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and an internet connection.",
        "inLanguage": ["en", "pt-BR"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://github.com/t00ls-dev/route-gpx/blob/main/LICENSE",
        "image": "https://t00ls-dev.github.io/route-gpx/social-card.png",
        "softwareHelp": {
          "@type": "WebPage",
          "url": "https://t00ls-dev.github.io/route-gpx/help.html"
        }
      }
    </script>
  </head>
  <body>
    <noscript
      ><p>
        route-gpx needs JavaScript to calculate routes and export GPX.
        <a href="./help.html">Help</a>
      </p></noscript
    >
    <header>
      <a aria-label="route-gpx" class="brand" href="#"
        ><img
          class="brand-icon"
          src="/icons/icon.svg"
          width="28"
          height="28"
          alt=""
          aria-hidden="true"
        />route<span>-gpx</span></a
      ><label class="language-control"
        ><span class="sr-only">Language / Idioma</span
        ><select id="language" aria-label="Language / Idioma">
          <option value="en">English</option>
          <option value="pt">Português</option>
        </select></label
      ><a id="help" href="./help.html">Help</a>
    </header>
    <main>
      <aside aria-label="Plan your route">
        <div class="section-line page-heading">
          <h1>Plan your route</h1>
          <button id="example" type="button">Try example</button>
        </div>
        <details class="description-panel">
          <summary>Describe a route</summary>
          <label for="description" class="sr-only"
            >Where would you like to go?</label
          ><textarea
            id="description"
            rows="3"
            maxlength="4000"
            placeholder="From Metrô Uruguai via Postinho do Alto to Grumari"
          ></textarea
          ><button id="parse-description" type="button">Review</button>
          <div id="intent-preview"></div>
        </details>
        <section aria-label="Route points">
          <div class="section-line">
            <h2>Points</h2>
            <span id="point-count"></span>
          </div>
          <ol id="points"></ol>
          <div class="inline-actions">
            <button id="add" type="button">＋ Stop</button
            ><button id="reverse" type="button">⇅ Reverse</button
            ><button id="roundtrip" type="button">↶ Round trip</button>
          </div>
        </section>
        <div class="route-action">
          <button id="calculate" class="primary" type="button" disabled>
            Calculate route</button
          ><button id="undo" type="button" disabled>↶ Undo</button>
        </div>
        <p id="status" role="status" aria-live="polite">
          Set your start and destination.
        </p>
        <div class="route-options">
          <label class="check"
            ><input id="prefer" type="checkbox" checked /><span
              >Prefer main roads</span
            ></label
          >
          <label class="unit-control"
            ><span class="sr-only">Distance units</span
            ><select id="units" aria-label="Distance units">
              <option value="metric">km</option>
              <option value="imperial">mi</option>
            </select></label
          >
        </div>
        <details class="speed-options">
          <summary>Average speed</summary>
          <label class="speed-toggle"
            ><input id="use-average-speed" type="checkbox" />Enable</label
          >
          <div class="speed-field">
            <input
              id="average-speed"
              type="range"
              min="0"
              max="200"
              step="5"
              value="60"
              disabled
              aria-label="Average speed"
              aria-describedby="speed-range"
            /><output id="average-speed-value" for="average-speed">60</output
            ><span id="speed-unit">km/h</span
            ><button
              id="reset-speed"
              type="button"
              aria-label="Use router estimate"
              title="Use router estimate"
            >
              ×
            </button>
          </div>
          <p id="speed-range" class="hint">1–200 km/h</p>
        </details>
        <section id="summary" aria-label="Route summary"></section>
        <div class="export-actions">
          <button id="download" class="primary" disabled type="button">
            ↓ Download GPX</button
          ><button id="share" type="button" title="Copy route link">
            Copy link
          </button>
        </div>
        <div class="secondary-actions">
          <label class="file-button"
            >Import GPX<input
              id="import"
              type="file"
              accept=".gpx,application/gpx+xml,application/xml,text/xml"
          /></label>
          <details class="settings">
            <summary>Settings</summary>
            <label for="route-name">Trip name</label
            ><input
              id="route-name"
              maxlength="160"
              placeholder="My road trip"
            /><label for="osrm">OSRM server</label
            ><input id="osrm" type="url" /><label for="valhalla"
              >Valhalla fallback</label
            ><input id="valhalla" type="url" /><label for="nominatim"
              >Nominatim server</label
            ><input id="nominatim" type="url" /><button
              id="save-settings"
              type="button"
            >
              Apply settings
            </button>
            <details class="json-settings">
              <summary>Advanced: JSON</summary>
              <label for="state-json" class="sr-only"
                >Points and settings (latitude, longitude)</label
              ><textarea id="state-json" rows="8" spellcheck="false"></textarea
              ><button id="export-json" type="button">Load current state</button
              ><button id="apply-json" type="button">Apply JSON</button>
            </details>
          </details>
        </div>
        <footer>
          <span>Public, shared servers.</span>
          <a
            href="https://github.com/t00ls-dev/route-gpx"
            target="_blank"
            rel="noreferrer"
            >GitHub ↗</a
          >
        </footer>
      </aside>
      <section class="map-container" aria-label="Interactive map">
        <div id="map"></div>
        <div class="map-note" id="map-note">Place your start on the map</div>
        <button id="fit" class="fit-button" type="button">◎ Fit route</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
